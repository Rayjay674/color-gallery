<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>* {
box-sizing: border-box;
  padding: 0;
  margin: 0;
  text-align: center;
}

html, body {
  width: 100vw;
  height: 100vh;
}

main {
  width: 90%;
  height: 100%;
  margin-left: 10vw;
  position: sticky;
  text-align: center;
}

#navbar {
  width: 10vw;
  height: 100vh;
  background-color: #aaa;
  position: fixed;
  display: flex;
  flex-flow: column nowrap;
  justify-content: space-evenly;
  overflow: hidden;
}

#navbar h1 {
    font-size: 1em;
}

.page-button {
  width: 25%;
  height: 10%;
}

header {
  width: 100%;
  height: 15vh;
  padding: 0;
  text-align: center;
  background: linear-gradient(red 0%, orange 11%, yellow 22%, green 33%, blue 44%, purple 55%, pink 66%, brown 77%, #c0c0c0 88%)
}

#main-page {
  width: 100%;
  height: 100%;
  padding: 5px;
  text-align: center;
}

#main-page h1:first-of-type {
  font-size: 4em;
}

#main-page ul {
  list-style-type: none;
}

#main-page ul li {
  font-size: 1.7em;
}

#main-page .fact {
  font-size: 2em;
  font-weight: bold;
  font-style: italic;
  text-decoration: underline;
}

#main-page ul li p {
  font-size: 1.2em;
}

#content {
  width: 100%;
  height: 100%;
  text-align: center;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 25px;
}

.card {
  width: 20%;
  height: 10em;
  background-color: white;
  padding: 20px;
  border-radius: 3%;
}</style>
    <script defer>

  },

    category,

  }

  }

buttons.forEach((button) => {

    <title>Color Gallery</title>
  </head>
  <body>
    <nav id="navbar">
      <h1>Color Gallery</h1>
      <button class="page-btn" id="title-btn">Main Page</button>
      <button class="page-btn" id="red-btn">Red</button>
      <button class="page-btn" id="orange-btn">Orange</button>
      <button class="page-btn" id="yellow-btn">Yellow</button>
      <button class="page-btn" id="green-btn">Green</button>
      <button class="page-btn" id="blue-btn">Blue</button>
      <button class="page-btn" id="purple-btn">Purple</button>
      <button class="page-btn" id="pink-btn">Pink</button>
      <button class="page-btn" id="brown-btn">Brown</button>
      <button class="page-btn" id="monochrome-btn">Monochrome</button>
    </nav>
    <main> 
        <div id="header-div">
            <header>
              <h1 id="title">Color Gallery</h1>
            </header>
        </div>
      <div id="main-page">
        <h1>Main Page</h1>
        <h1>This is an h1 and there are <span class="fact"><mark>9</mark></span> categories of colors with:</h1>
        <ul>
          <li><span class="fact"><mark>217</mark></span> official colors across all categories</li>
          <li><p>and</p></li>
          <li><span class="fact">102</span> colors currently in queue</li>
          <li><p>with an additional</p></li>
          <li><span class="fact">48</span> colors awaiting discovery</li>
        </ul>
      </div>
        <div id="content">
          
        </div>
    </main>
  </body>
</html>
