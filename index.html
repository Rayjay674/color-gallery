<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <title>Color Gallery</title>
  </head>
  <body>
    <main>
      <div id="main-div">
        <nav id="navbar">
          <h1>Color Gallery</h1>
          <button class="page-btn" id="title-btn">Main Page</button>
          <button class="page-btn" id="red-btn">Red</button>
          <button class="page-btn" id="orange-btn">Orange</button>
          <button class="page-btn" id="yellow-btn">Yellow</button>
          <button class="page-btn" id="green-btn">Green</button>
          <button class="page-btn" id="blue-btn">Blue</button>
          <button class="page-btn" id="purple-btn">Purple</button>
          <button class="page-btn" id="pink-btn">Pink</button>
          <button class="page-btn" id="brown-btn">Brown</button>
          <button class="page-btn" id="monochrome-btn">Monochrome</button>
        </nav>
        <div id="content">
          <div id="header-div">
            <header>
              <h1 id="title">Color Gallery</h1>
            </header>
          </div>
          <section id="red" class="hidden">
            <h1 class="color-title">Red</h1>
          </section>
          <section id="orange" class="hidden">
            <h1 class="color-title">Orange</h1>
          </section>
          <section id="yellow" class="hidden">
            <h1>Yellow</h1>
          </section>
          <section id="green" class="hidden">
            <h1>Green</h1>
          </section>
          <section id="blue" class="hidden">
            <h1>Blue</h1>
          </section>
          <section id="purple" class="hidden">
            <h1>Purple</h1>
          </section>
          <section id="pink" class="hidden">
            <h1>Pink</h1>
          </section>
          <section id="brown" class="hidden">
            <h1>Brown</h1>
          </section>
          <section id="monochrome" class="hidden">
            <h1>Monochrome</h1>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
